<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qviqa · Фриланс-заказы</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <h1>📡 Qviqa Feed</h1>
    <span id="status" class="status">не подключено</span>
  </header>

  <main>
    <section class="controls">
      <input id="keywords" type="text" placeholder="python, бот, дизайн…" />
      <button id="connect">Слушать поток</button>
      <span class="hint">через запятую; пусто — все заказы</span>
    </section>

    <section class="sources" id="sources"></section>

    <ul id="feed" class="feed"></ul>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
